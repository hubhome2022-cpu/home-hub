<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Hub</title>
<meta name="description" content="Our family home hub: calendar, meals, chores, projects, fitness and devices.">
<meta name="theme-color" content="#F3F1EE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Home Hub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <div class="boot" role="status">
    <span class="boot-mark" aria-hidden="true"></span>
    <span>Starting Home Hub…</span>
  </div>
</div>

<!-- Browsers too old for modern JavaScript land here instead of a blank screen. -->
<script nomodule>
  document.getElementById('app').innerHTML =
    '<div class="boot"><p style="max-width:32em;text-align:center;line-height:1.5">' +
    'This browser is too old to run Home Hub.<br><br><small>' +
    navigator.userAgent.replace(/</g, '&lt;') + '</small></p></div>';
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
